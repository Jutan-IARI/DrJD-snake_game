<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Snake Game by Dr. Juton Das</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(circle at top,
        #243447,
        #080b0f 70%);

    color: white;

    font-family: Arial, sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;
}

.game {

    width: min(94vw, 650px);

    text-align: center;
}

h1 {

    margin: 8px 0 12px;

    font-size: 28px;

    text-shadow:
        0 2px 8px #000;
}

.top {

    display: flex;

    justify-content: space-between;

    background: #18232d;

    padding: 12px 16px;

    border-radius: 14px;

    margin-bottom: 10px;

    font-weight: bold;

    box-shadow:
        0 4px 15px #0008;
}

canvas {

    width: 100%;

    max-width: 600px;

    aspect-ratio: 1;

    display: block;

    margin: auto;

    background: #071009;

    border-radius: 16px;

    box-shadow:
        0 8px 30px #000;

    touch-action: none;
}

.controls {

    margin: 14px auto 0;

    display: grid;

    grid-template-columns:
        repeat(3, 78px);

    gap: 8px;

    justify-content: center;
}

button {

    border: none;

    border-radius: 12px;

    background: #263746;

    color: white;

    font-weight: bold;

    padding: 14px;

    cursor: pointer;

    box-shadow:
        0 4px 8px #0008;
}

button:active {

    transform: scale(.94);

    background: #3c596d;
}

.empty {

    visibility: hidden;
}

.actions {

    margin-top: 10px;

    display: flex;

    gap: 8px;

    justify-content: center;
}

.actions button {

    padding:
        10px 20px;
}

#message {

    min-height: 25px;

    margin-top: 8px;

    color: #ffd43b;

    font-weight: bold;
}

</style>

</head>


<body>


<div class="game">

<h1>
🐍 Snake Game by Dr. Juton Das
</h1>


<div class="top">

<span>
Score:
<b id="score">0</b>
</span>

<span id="bonus"></span>

</div>


<canvas
id="game"
width="600"
height="600">
</canvas>


<div id="message"></div>


<!-- CONTROL BUTTONS -->

<div class="controls">

<button class="empty">.</button>

<button onclick="setDir(0,-1)">
▲
</button>

<button class="empty">.</button>


<button onclick="setDir(-1,0)">
◀
</button>

<button onclick="togglePause()">
⏸
</button>

<button onclick="setDir(1,0)">
▶
</button>


<button class="empty">.</button>

<button onclick="setDir(0,1)">
▼
</button>

<button class="empty">.</button>

</div>


<div class="actions">

<button onclick="restart()">
Restart
</button>

<button
onclick="togglePause()"
id="pauseBtn">

Pause

</button>

</div>

</div>



<script>


// ==========================================
// GAME SETTINGS
// ==========================================

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const GRID = 30;

const CELL =
canvas.width / GRID;


// ==========================================
// GAME VARIABLES
// ==========================================

let snake;

let direction;

let nextDirection;

let frog;

let rat;

let score;

let frogCount;

let ratActive;

let ratUntil;

let paused;

let gameOver;

let timer;


// ==========================================
// RANDOM POSITION
// ==========================================

function randomPosition() {

    return {

        x:
        Math.floor(
            Math.random() * GRID
        ) * CELL,

        y:
        Math.floor(
            Math.random() * GRID
        ) * CELL

    };
}


// ==========================================
// FIND EMPTY POSITION
// ==========================================

function emptyPosition() {

    let position;

    do {

        position =
        randomPosition();

    }

    while (

        snake.some(
            part =>
            part.x === position.x &&
            part.y === position.y
        )

    );

    return position;
}


// ==========================================
// START / RESTART
// ==========================================

function restart() {

    snake = [];

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        snake.push({

            x:
            300 - i * CELL,

            y: 300

        });

    }


    direction = {

        x: 1,
        y: 0

    };


    nextDirection = {

        x: 1,
        y: 0

    };


    score = 0;

    frogCount = 0;

    ratActive = false;

    ratUntil = 0;

    paused = false;

    gameOver = false;


    frog =
    emptyPosition();


    document.getElementById(
        "message"
    ).textContent = "";


    document.getElementById(
        "pauseBtn"
    ).textContent = "Pause";


    updateUI();


    clearInterval(timer);


    timer =
    setInterval(
        gameLoop,
        150
    );


    draw();

}


// ==========================================
// CHANGE DIRECTION
// ==========================================

function setDir(x, y) {

    if (gameOver)
        return;


    // Don't allow 180° turn

    if (
        x === -direction.x &&
        y === -direction.y
    ) {

        return;

    }


    nextDirection = {

        x: x,
        y: y

    };

}


// ==========================================
// PAUSE
// ==========================================

function togglePause() {

    if (gameOver)
        return;


    paused = !paused;


    document.getElementById(
        "pauseBtn"
    ).textContent =
        paused
        ? "Play"
        : "Pause";

}


// ==========================================
// GAME LOOP
// ==========================================

function gameLoop() {

    if (
        paused ||
        gameOver
    ) {

        return;

    }


    direction =
    nextDirection;


    // New head

    let head = {

        x:
        snake[0].x +
        direction.x * CELL,

        y:
        snake[0].y +
        direction.y * CELL

    };


    // ======================================
    // WALL WRAP
    // ======================================

    if (
        head.x < 0
    ) {

        head.x =
        canvas.width - CELL;

    }


    if (
        head.x >= canvas.width
    ) {

        head.x = 0;

    }


    if (
        head.y < 0
    ) {

        head.y =
        canvas.height - CELL;

    }


    if (
        head.y >= canvas.height
    ) {

        head.y = 0;

    }


    // ======================================
    // SELF COLLISION
    // ======================================

    if (

        snake.some(
            part =>
            part.x === head.x &&
            part.y === head.y
        )

    ) {

        gameOver = true;

        clearInterval(timer);

        document.getElementById(
            "message"
        ).textContent =
        "GAME OVER — Press Restart";

        draw();

        return;

    }


    snake.unshift(head);


    // ======================================
    // FROG EATEN
    // ======================================

    if (

        head.x === frog.x &&
        head.y === frog.y

    ) {

        score += 10;

        frogCount++;


        frog =
        emptyPosition();


        // Every 5 frogs

        if (
            frogCount === 5 &&
            !ratActive
        ) {

            createRat();

            frogCount = 0;

        }

    }

    else {

        snake.pop();

    }


    // ======================================
    // RAT BONUS
    // ======================================

    if (ratActive) {


        // Time expired

        if (
            Date.now() >= ratUntil
        ) {

            ratActive = false;

        }


        // Rat eaten

        else if (

            head.x === rat.x &&
            head.y === rat.y

        ) {

            score += 5;

            ratActive = false;

        }

    }


    updateUI();

    draw();

}


// ==========================================
// CREATE RAT
// ==========================================

function createRat() {

    rat =
    emptyPosition();

    ratActive = true;

    ratUntil =
    Date.now() + 5000;

}


// ==========================================
// UPDATE SCORE
// ==========================================

function updateUI() {

    document.getElementById(
        "score"
    ).textContent = score;


    if (ratActive) {

        let seconds =
        Math.ceil(
            Math.max(
                0,
                ratUntil -
                Date.now()
            ) / 1000
        );


        document.getElementById(
            "bonus"
        ).textContent =
        "🐀 BONUS RAT: "
        + seconds
        + "s";

    }

    else {

        document.getElementById(
            "bonus"
        ).textContent = "";

    }

}


// ==========================================
// DRAW GAME
// ==========================================

function draw() {

    // Background

    ctx.fillStyle =
    "#071009";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ======================================
    // GRID
    // ======================================

    ctx.strokeStyle =
    "#142219";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= canvas.width;
        i += CELL
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i,
            0
        );

        ctx.lineTo(
            i,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i
        );

        ctx.lineTo(
            canvas.width,
            i
        );

        ctx.stroke();

    }


    // ======================================
    // FROG
    // ======================================

    drawFrog(
        frog.x,
        frog.y
    );


    // ======================================
    // RAT
    // ======================================

    if (ratActive) {

        drawRat(
            rat.x,
            rat.y
        );

    }


    // ======================================
    // SNAKE
    // ======================================

    for (
        let i = snake.length - 1;
        i >= 0;
        i--
    ) {

        if (i === 0) {

            drawSnakeHead(
                snake[i]
            );

        }

        else {

            drawSnakeBody(
                snake[i],
                i
            );

        }

    }

}


// ==========================================
// DRAW SNAKE BODY
// ==========================================

function drawSnakeBody(part, index) {

    let x = part.x;
    let y = part.y;


    // Shadow

    ctx.fillStyle =
    "#061006";

    ctx.beginPath();

    ctx.roundRect(
        x + 2,
        y + 3,
        CELL - 3,
        CELL - 2,
        9
    );

    ctx.fill();


    // Body

    ctx.fillStyle =
    index % 2 === 0
    ? "#31b84a"
    : "#249b3d";


    ctx.beginPath();

    ctx.roundRect(
        x + 2,
        y + 2,
        CELL - 4,
        CELL - 4,
        8
    );

    ctx.fill();


    // Body highlight

    ctx.fillStyle =
    "#73e687";

    ctx.beginPath();

    ctx.arc(
        x + 7,
        y + 6,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


// ==========================================
// DRAW SNAKE HEAD
// ==========================================

function drawSnakeHead(part) {

    let x = part.x;
    let y = part.y;


    // Head

    ctx.fillStyle =
    "#49d65e";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        CELL,
        CELL,
        9
    );

    ctx.fill();


    // ======================================
    // EYES
    // ======================================

    ctx.fillStyle = "white";


    // Eye positions depend on direction

    let eye1;
    let eye2;


    if (direction.x === 1) {

        eye1 =
        {
            x: x + 14,
            y: y + 6
        };

        eye2 =
        {
            x: x + 14,
            y: y + 14
        };

    }

    else if (direction.x === -1) {

        eye1 =
        {
            x: x + 6,
            y: y + 6
        };

        eye2 =
        {
            x: x + 6,
            y: y + 14
        };

    }

    else if (direction.y === -1) {

        eye1 =
        {
            x: x + 6,
            y: y + 6
        };

        eye2 =
        {
            x: x + 14,
            y: y + 6
        };

    }

    else {

        eye1 =
        {
            x: x + 6,
            y: y + 14
        };

        eye2 =
        {
            x: x + 14,
            y: y + 14
        };

    }


    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.arc(
        eye2.x,
        eye2.y,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Pupils

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        eye1.x,
        eye1.y,
        1.5,
        0,
        Math.PI * 2
    );

    ctx.arc(
        eye2.x,
        eye2.y,
        1.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // ======================================
    // TONGUE
    // ======================================

    ctx.strokeStyle =
    "#ff5264";

    ctx.lineWidth = 2;

    ctx.beginPath();


    if (direction.x === 1) {

        ctx.moveTo(
            x + CELL,
            y + CELL / 2
        );

        ctx.lineTo(
            x + CELL + 6,
            y + CELL / 2
        );

        ctx.lineTo(
            x + CELL + 9,
            y + CELL / 2 - 3
        );

        ctx.moveTo(
            x + CELL + 6,
            y + CELL / 2
        );

        ctx.lineTo(
            x + CELL + 9,
            y + CELL / 2 + 3
        );

    }


    else if (direction.x === -1) {

        ctx.moveTo(
            x,
            y + CELL / 2
        );

        ctx.lineTo(
            x - 6,
            y + CELL / 2
        );

        ctx.lineTo(
            x - 9,
            y + CELL / 2 - 3
        );

        ctx.moveTo(
            x - 6,
            y + CELL / 2
        );

        ctx.lineTo(
            x - 9,
            y + CELL / 2 + 3
        );

    }


    else if (direction.y === -1) {

        ctx.moveTo(
            x + CELL / 2,
            y
        );

        ctx.lineTo(
            x + CELL / 2,
            y - 6
        );

    }


    else {

        ctx.moveTo(
            x + CELL / 2,
            y + CELL
        );

        ctx.lineTo(
            x + CELL / 2,
            y + CELL + 6
        );

    }


    ctx.stroke();

}


// ==========================================
// DRAW FROG 🐸
// ==========================================

function drawFrog(x, y) {

    // Body

    ctx.fillStyle =
    "#49c95a";

    ctx.beginPath();

    ctx.ellipse(
        x + 10,
        y + 12,
        8,
        6,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Head

    ctx.fillStyle =
    "#62dc69";

    ctx.beginPath();

    ctx.arc(
        x + 10,
        y + 10,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Eyes

    ctx.fillStyle =
    "#8bea83";

    ctx.beginPath();

    ctx.arc(
        x + 6,
        y + 5,
        4,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 14,
        y + 5,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Pupils

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        x + 6,
        y + 5,
        1.7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        x + 14,
        y + 5,
        1.7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Mouth

    ctx.strokeStyle =
    "#164d1c";

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.arc(
        x + 10,
        y + 11,
        4,
        0,
        Math.PI
    );

    ctx.stroke();


    // Feet

    ctx.fillStyle =
    "#3aaa4b";

    ctx.fillRect(
        x + 1,
        y + 15,
        6,
        3
    );

    ctx.fillRect(
        x + 13,
        y + 15,
        6,
        3
    );

}


// ==========================================
// DRAW RAT 🐀
// ==========================================

function drawRat(x, y) {

    // Tail

    ctx.strokeStyle =
    "#d98c8c";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        x + 3,
        y + 13
    );

    ctx.quadraticCurveTo(
        x - 4,
        y + 18,
        x + 1,
        y + 19
    );

    ctx.stroke();


    // Body

    ctx.fillStyle =
    "#a9a9a9";

    ctx.beginPath();

    ctx.ellipse(
        x + 10,
        y + 12,
        8,
        5,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Head

    ctx.beginPath();

    ctx.arc(
        x + 16,
        y + 9,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Ear

    ctx.fillStyle =
    "#e9a0a0";

    ctx.beginPath();

    ctx.arc(
        x + 17,
        y + 4,
        3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Eye

    ctx.fillStyle = "black";

    ctx.beginPath();

    ctx.arc(
        x + 18,
        y + 8,
        1.5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Nose

    ctx.fillStyle =
    "#ed7777";

    ctx.beginPath();

    ctx.arc(
        x + 21,
        y + 10,
        2,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Whiskers

    ctx.strokeStyle =
    "#dddddd";

    ctx.lineWidth = 1;

    ctx.beginPath();

    ctx.moveTo(
        x + 19,
        y + 11
    );

    ctx.lineTo(
        x + 24,
        y + 9
    );

    ctx.moveTo(
        x + 19,
        y + 12
    );

    ctx.lineTo(
        x + 24,
        y + 14
    );

    ctx.stroke();

}


// ==========================================
// KEYBOARD CONTROL
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        const key =
        event.key.toLowerCase();


        if (
            key === "arrowup" ||
            key === "w"
        ) {

            setDir(0, -1);

        }


        if (
            key === "arrowdown" ||
            key === "s"
        ) {

            setDir(0, 1);

        }


        if (
            key === "arrowleft" ||
            key === "a"
        ) {

            setDir(-1, 0);

        }


        if (
            key === "arrowright" ||
            key === "d"
        ) {

            setDir(1, 0);

        }


        if (key === " ") {

            togglePause();

        }

    }
);


// ==========================================
// START GAME
// ==========================================

restart();


</script>

</body>

</html>
